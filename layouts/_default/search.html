{{ define "main" }}
<div class="search-page">
  <h1 class="page-title">Search</h1>

  <div class="search-container">
    <input id="search-query" type="search" placeholder="输入关键词搜索文章，多个词用空格隔开…" autocomplete="off" aria-label="搜索文章">
  </div>

  <div class="search-suggestions">
    <div class="tag-cloud">
      {{/* 只放文章最多的几个标签当提示，完整列表在 /tags/ */}}
      {{ range first 12 .Site.Taxonomies.tags.ByCount }}
        {{/* 这里的 .Page.Title 是标签名， .Count 是文章数 */}}
        <a href="{{ .Page.RelPermalink }}" class="tag-chip">
          <span class="tag-name">#{{ .Page.Title }}</span>
          <span class="tag-count">{{ .Count }}</span>
        </a>
      {{ end }}
      <a href="{{ "/tags/" | relURL }}" class="tag-all">All tags →</a>
    </div>
  </div>

  <div id="search-results" aria-live="polite"></div>
</div>

<script>
(function() {
  var input = document.getElementById('search-query');
  var resultsBox = document.getElementById('search-results');
  var suggestions = document.querySelector('.search-suggestions');
  var MAX_RESULTS = 50;
  var posts = null;

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function highlight(text, terms) {
    var html = escapeHTML(text);
    terms.forEach(function(t) {
      var re = new RegExp(escapeHTML(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      html = html.replace(re, function(m) { return '<mark>' + m + '</mark>'; });
    });
    return html;
  }

  // 截取正文里第一个命中词附近的一段话
  function snippet(post, terms) {
    var lower = post._content;
    var pos = -1;
    terms.forEach(function(t) {
      var i = lower.indexOf(t);
      if (i !== -1 && (pos === -1 || i < pos)) pos = i;
    });
    if (pos === -1) return '';
    var start = Math.max(0, pos - 30);
    var text = post.content.slice(start, pos + 70).replace(/\s+/g, ' ');
    return (start > 0 ? '…' : '') + text + '…';
  }

  function search(query) {
    var terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    var hits = [];
    posts.forEach(function(post) {
      var score = 0;
      for (var i = 0; i < terms.length; i++) {
        var t = terms[i];
        var inTitle = post._title.indexOf(t) !== -1;
        var inTags = post._tags.indexOf(t) !== -1;
        var inContent = post._content.indexOf(t) !== -1;
        if (!inTitle && !inTags && !inContent) return;
        score += (inTitle ? 10 : 0) + (inTags ? 5 : 0) + (inContent ? 1 : 0);
      }
      hits.push({ post: post, score: score });
    });
    hits.sort(function(a, b) {
      return b.score - a.score || (a.post.date < b.post.date ? 1 : -1);
    });
    return { terms: terms, hits: hits };
  }

  function render() {
    var query = input.value.trim();
    var url = new URL(window.location.href);
    if (query) { url.searchParams.set('q', query); } else { url.searchParams.delete('q'); }
    window.history.replaceState(null, '', url);

    if (!query) {
      suggestions.hidden = false;
      resultsBox.innerHTML = '';
      return;
    }
    suggestions.hidden = true;
    if (!posts) {
      resultsBox.innerHTML = '<p class="search-meta">正在载入索引…</p>';
      return;
    }

    var res = search(query);
    if (!res.hits.length) {
      resultsBox.innerHTML = '<p class="search-meta">没有找到相关文章。</p>';
      return;
    }
    var html = '<p class="search-meta">找到 ' + res.hits.length + ' 篇' +
      (res.hits.length > MAX_RESULTS ? '，显示前 ' + MAX_RESULTS + ' 篇' : '') + '</p>';
    res.hits.slice(0, MAX_RESULTS).forEach(function(hit) {
      var post = hit.post;
      var snip = snippet(post, res.terms);
      html += '<div class="search-result">' +
        '<div class="search-result-head">' +
          '<span class="post-date">' + escapeHTML(post.date) + '</span>' +
          '<a class="search-result-title" href="' + escapeHTML(post.permalink) + '">' + highlight(post.title, res.terms) + '</a>' +
        '</div>' +
        (snip ? '<p class="search-result-snippet">' + highlight(snip, res.terms) + '</p>' : '') +
      '</div>';
    });
    resultsBox.innerHTML = html;
  }

  // 索引有一两 MB，等真要搜的时候（点进输入框或带着 ?q= 进来）再下载
  var loading = false;
  function loadIndex() {
    if (loading) return;
    loading = true;
    fetch('{{ "index.json" | relURL }}')
      .then(function(response) { return response.json(); })
      .then(function(data) {
        posts = data.map(function(p) {
          p.content = p.content || '';
          p._title = (p.title || '').toLowerCase();
          p._tags = (Array.isArray(p.tags) ? p.tags.join(' ') : String(p.tags || '')).toLowerCase();
          p._content = p.content.toLowerCase();
          return p;
        });
        render();
      })
      .catch(function() {
        loading = false;
        resultsBox.innerHTML = '<p class="search-meta">索引载入失败，请刷新重试。</p>';
      });
  }

  var initial = new URLSearchParams(window.location.search).get('q');
  if (initial) { input.value = initial; }
  input.addEventListener('focus', loadIndex);
  input.addEventListener('input', function() { loadIndex(); render(); });
  render();
  if (initial) loadIndex();
})();
</script>
{{ end }}

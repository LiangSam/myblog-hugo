<footer class="site-footer">
  <div class="footer-links">
    <a href="{{ "/links/" | relURL }}">Links</a>
    <a href="{{ "/guestbook/" | relURL }}">Guestbook</a>
    <a href="{{ "/index.xml" | relURL }}">RSS</a>
    <a href="https://tarot.liangmouyin.com" target="_blank" rel="noopener">Tarot</a>
  </div>
  {{/* 起始年份取最早的文章，结束年份取构建时的年份，不用每年手改 */}}
  {{ $posts := where site.RegularPages "Section" "blog" }}
  {{ $start := now.Year }}{{ with $posts.ByDate }}{{ $start = (index . 0).Date.Year }}{{ end }}
  <p class="footer-copy">Copyright © {{ $start }}-{{ now.Year }}, {{ site.Params.author }}</p>
</footer>

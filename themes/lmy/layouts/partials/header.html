<header class="site-header">
  <div class="header-inner">
    <a href="{{ "/" | relURL }}" class="site-title" aria-label="{{ .Site.Title }}">
      {{ with .Site.Params.avatar }}<img src="{{ . | relURL }}" alt="" class="site-avatar" />{{ end }}
      <span class="site-name">{{ .Site.Params.author | default .Site.Title }}</span>
    </a>
    <nav class="main-nav">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL | relURL }}" class="nav-link{{ if eq $.RelPermalink (.URL | relURL) }} active{{ end }}">{{ .Name }}</a>
      {{ end }}
    </nav>
    <div class="header-actions">
      <a href="{{ "/search/" | relURL }}" class="header-icon" aria-label="搜索" title="搜索">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.65" y2="16.65"/></svg>
      </a>
      <button class="header-icon theme-toggle" type="button" aria-label="切换深浅色" title="切换深浅色" onclick="window.lmyToggleTheme && window.lmyToggleTheme()">
        <span class="icon-sun"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></span>
        <span class="icon-moon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
      </button>
    </div>
  </div>
</header>

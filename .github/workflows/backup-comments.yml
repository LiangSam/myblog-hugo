name: Weekly comments D1 backup

on:
  schedule:
    # 每周一 UTC 19:00（北京时间周二 03:00）
    - cron: '0 19 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Export D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p backup
          npx --yes wrangler@4 d1 export lmy-comments-trial --remote --output="backup/comments.sql"
          test -s backup/comments.sql

      # 仓库是公开的，任何 GitHub 用户都能下载 artifact，所以先加密
      - name: Encrypt dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE"
          stamp=$(date -u +%Y-%m-%d)
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            --output "backup/comments-$stamp.sql.gpg" backup/comments.sql <<< "$BACKUP_PASSPHRASE"
          shred -u backup/comments.sql
          echo "STAMP=$stamp" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: comments-d1-${{ env.STAMP }}
          path: backup/comments-*.sql.gpg
          retention-days: 90
          if-no-files-found: error

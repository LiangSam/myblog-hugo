name: Scheduled Build for Cloudflare Pages

on:
  schedule:
    # 注意：Cron 使用的是 UTC 时间。
    # 北京时间 21:00 等于 UTC 时间 13:00。
    - cron: '5 13 * * *' # 建议设在 13:05，避开整点高峰
  workflow_dispatch: # 允许你手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages Deploy
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          test -n "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
          curl --fail --silent --show-error --request POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK"

# ============================================================
# 基础配置 (Base Configuration)
# ============================================================
baseURL = "https://liangmouyin.com"
title = "梁某银"
author = "梁某银"
copyright = "Copyright © 2018-2026, 梁某银"
locale = "zh-CN"
# 让 Hugo 正确统计中文字数、截取中文摘要
hasCJKLanguage = true
theme = 'lmy'

# 生成 robots.txt，对 SEO 友好
enableRobotsTXT = true

# ============================================================
# 输出配置 (Outputs)
# ⚠️ 必须包含 JSON，否则搜索功能无法使用
# ============================================================
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ============================================================
# 链接格式 (Permalinks)
# ============================================================
[permalinks]
  blog = "/blog/:slug/"
  tags = "/tags/:slug/"

# ============================================================
# 菜单配置 (Menu)
# ⚠️ 这里定义了导航栏，确保没有重复的 [[menu.main]]
# ============================================================
[menu]

  [[menu.main]]
    identifier = "essentials"
    name = "精选"
    url = "/essentials/"
    weight = 20    # 精选文章

  [[menu.main]]
    identifier = "blog"
    name = "归档"
    url = "/blog/"
    weight = 30    # 归档

  [[menu.main]]
    identifier = "now"
    name = "近况"
    url = "/now/"
    weight = 40    # 博主的近况

  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 50


# ============================================================
# 参数配置 (Params)
# ============================================================
[params]
  # 配色方案：warm（暖色琥珀）或 indigo（靛青冷峻）
  colorScheme = "indigo"
  description = "记录，分享，成长"
  favicon = "images/favicon.png"
  images = ["images/favicon.png"]
  author = "梁某银"
  avatar = "images/favicon.png"
  title = "梁某银"
  dateFormat = "2006-01-02"

# ============================================================
# 代码高亮配置 (Markup)
# ============================================================
[markup]
[markup.highlight]
    style = 'friendly'
    lineNos = true
    lineNumbersInTable = false
    codeFences = true

# ============================================================
# 图片缩放 (Images)
# 在 Cloudflare 打开 liangmouyin.com 的 Image Transformations 之后，
# 把 resize 改成 true：卡片封面按 640px、正文图片按 1440px 输出 WebP/AVIF。
# 没打开就设 true 会让图片全部 404。
# ============================================================
[params.imageCDN]
  host = "https://img.liangmouyin.com"
  resize = false
  quality = 82

# ============================================================
# 相关文章 (Related)
# 文章末尾的"相关文章"按标签匹配，日期相近的优先，新旧文章都算
# ============================================================
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10
